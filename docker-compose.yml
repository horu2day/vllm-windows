services:
    vllm-openai:
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities:
                              - gpu
        volumes:
            - ~/.cache/huggingface:/root/.cache/huggingface
            - ./models:/models
        environment:
            - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
            - NCCL_P2P_DISABLE=1
            - NCCL_IB_DISABLE=1
        ports:
            - 8000:8000
        ipc: host
        image: vllm/vllm-openai:latest
        # TranslateGemma 4B - purpose-built translation model, 55 languages.
        # Weights are 8.6 GB in bf16, leaving ~2.7 GiB of a 12 GiB card for the
        # KV cache and activations. Gemma3 uses sliding-window attention on 28 of
        # its 34 layers, so 4096 tokens of KV cache cost roughly 0.2 GB.
        # The model is trained for a 2K-token input context; 4096 leaves room for
        # the prompt plus the translation.
        # If VRAM gets tight, lower --max-num-seqs first.
        # Drop --enforce-eager for ~20-30% more throughput if VRAM allows.
        command: --model /models/translategemma-4b-it --served-model-name translategemma --gpu-memory-utilization 0.90 --max-model-len 4096 --max-num-seqs 8 --dtype bfloat16 --enforce-eager
        # Previous config (general-purpose chat model with tool calling):
        # command: --model Qwen/Qwen3-4B-Thinking-2507 --served-model-name local-qwen-thinking --gpu-memory-utilization 0.9 --enforce-eager --max-model-len 8192 --enable-auto-tool-choice --tool-call-parser hermes --reasoning-parser qwen3
